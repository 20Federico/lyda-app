<div class="app-shell">
  <aside class="sidebar" [class.sidebar--collapsed]="isSidebarCollapsed">
    <div class="sidebar__top">
      <div class="sidebar__header">
        @if (!isSidebarCollapsed) {
          <h2>Lyda</h2>
        }

        <button
          type="button"
          class="sidebar__toggle"
          (click)="toggleSidebar()"
          [attr.aria-label]="isSidebarCollapsed ? 'Espandi sidebar' : 'Comprimi sidebar'"
          [lydaTooltip]="isSidebarCollapsed ? 'Espandi sidebar' : 'Comprimi sidebar'"
          [lydaTooltipPosition]="isSidebarCollapsed ? 'right' : 'bottom'"
        >
          @if (!isSidebarCollapsed) {
            <svg lucidePanelLeftClose class="sidebar__toggle-icon"></svg>
          } @else {
            <svg lucidePanelLeftOpen class="sidebar__toggle-icon"></svg>
          }
        </button>
      </div>

      <nav>
        <a routerLink="/chat" routerLinkActive="active" [attr.title]="isSidebarCollapsed ? 'Chat' : null"
          [lydaTooltip]="isSidebarCollapsed ? 'Chat' : null"
          lydaTooltipPosition="right"
        >
          <svg lucideMessageSquare class="sidebar__icon"></svg>
          @if (!isSidebarCollapsed) {
            <span>Chat</span>
          }
        </a>

        <a routerLink="/tasks" routerLinkActive="active" [attr.title]="isSidebarCollapsed ? 'Tasks' : null"
          [lydaTooltip]="isSidebarCollapsed ? 'Tasks' : null"
          lydaTooltipPosition="right"
          >
          <svg lucideSquareCheckBig class="sidebar__icon"></svg>
          @if (!isSidebarCollapsed) {
            <span>Tasks</span>
          }
        </a>

        <a routerLink="/projects" routerLinkActive="active" [attr.title]="isSidebarCollapsed ? 'Projects' : null"
          [lydaTooltip]="isSidebarCollapsed ? 'Projects' : null"
          lydaTooltipPosition="right"
          >
          <svg lucideFolderOpen class="sidebar__icon"></svg>
          @if (!isSidebarCollapsed) {
            <span>Projects</span>
          }
        </a>

        <a routerLink="/reminders" routerLinkActive="active" [attr.title]="isSidebarCollapsed ? 'Reminders' : null"
          [lydaTooltip]="isSidebarCollapsed ? 'Reminders' : null"
          lydaTooltipPosition="right"
          >
          <svg lucideBell class="sidebar__icon"></svg>
          @if (!isSidebarCollapsed) {
            <span>Reminders</span>
          }
        </a>
      </nav>
    </div>

    <div class="sidebar__bottom">
      <div class="profile-wrapper">
        <button
          class="profile-trigger"
          type="button"
          (click)="toggleProfileMenu($event)"
          [attr.title]="isSidebarCollapsed ? user.name : null"
          [lydaTooltip]="isSidebarCollapsed ? 'Account' : null"
          lydaTooltipPosition="right"
        >
          <div class="profile-avatar">F</div>

          @if (!isSidebarCollapsed) {
            <div class="profile-meta">
              <span class="profile-name">{{ user.name }}</span>
              <span class="profile-subtitle">Profilo</span>
            </div>
          }
        </button>

        @if (isProfileMenuOpen) {
          <div class="profile-menu" (click)="$event.stopPropagation()">
            <div class="profile-menu__email">
              <span>{{ user.email }}</span>
            </div>

            <button type="button" class="profile-menu__item" (click)="onSettings()">
              <svg lucideSettings class="profile-menu__icon"></svg>
              <span>Settings</span>
            </button>

            <button
              type="button"
              class="profile-menu__item profile-menu__item--danger"
              (click)="onLogout()"
            >
              <svg lucideLogOut class="profile-menu__icon"></svg>
              <span>Logout</span>
            </button>
          </div>
        }
      </div>
    </div>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
