<div class="rp-page">
  <div class="rp-card">
    <div class="rp-title">Imposta una nuova password</div>
    <div class="rp-subtitle">Scegli una password sicura e confermala.</div>

    @if (success) {
      <div class="rp-success">{{ success }}</div>
    }

    @if (error) {
      <div class="rp-error">{{ error }}</div>
    }

    <form (ngSubmit)="onFormEnter()">
      <label class="field">
        <span>Nuova password</span>
        <input
          [(ngModel)]="password"
          name="password"
          type="password"
          minlength="8"
          placeholder="Min. 8 caratteri"
        />
      </label>

      <label class="field">
        <span>Conferma password</span>
        <input
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          type="password"
          minlength="8"
          placeholder="Ripeti la password"
        />
      </label>

      <div class="actions">
        <!-- qui puoi usare routerLink OR click -->
        <button class="btn btn-ghost" type="button" (click)="goToLogin()" [disabled]="isLoading">
          Torna al login
        </button>

        <button class="btn btn-primary" type="submit" [disabled]="isResetDisabled">
          @if (isLoading) {
            <span>Salvo…</span>
          } @else {
            <span>Salva password</span>
          }
        </button>
      </div>

      <div class="hint">Se il link è scaduto, torna al login e usa “Password dimenticata?”.</div>
    </form>
  </div>
</div>
